<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style test</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="container">
    <h1>Style test</h1>

    <h2>Buttons</h2>
    <button class="btn">Next</button>
    <button class="btn" disabled>Disabled</button>

    <h2>Checkboxes</h2>
    <label class="checkbox"><input type="checkbox" /> Oven</label>
    <label class="checkbox"><input type="checkbox" /> Air fryer</label>

    <h2>Spinner</h2>
    <div class="spinner"></div>

    <h2>Cards</h2>
    <div class="card-grid">
      <div class="card"><h3>Tomato Pasta</h3><p>25 min</p></div>
      <div class="card"><h3>Omelet</h3><p>15 min</p></div>
      <div class="card"><h3>Veggie Soup</h3><p>40 min</p></div>
      <div class="card"><h3>Fried Rice</h3><p>30 min</p></div>
    </div>
  </div>
</body>
</html>
